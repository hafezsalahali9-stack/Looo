<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يانصيب شام كاش</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0f1f; color: #eee; padding: 10px; }
        .container { max-width: 420px; margin: auto; }
        .card { background: #1a2745; padding: 20px; border-radius: 15px; margin: 12px 0; }
        h1 { color: #f0c27a; text-align: center; margin: 15px 0; font-size: 24px; }
        h2 { color: #ccc; margin: 8px 0; font-size: 18px; }
        input, button { display: block; width: 100%; padding: 14px; margin: 8px 0; border-radius: 25px; border: none; font-size: 16px; }
        input { background: #0d1b33; color: white; border: 1px solid #3a4a6a; text-align: center; }
        button { background: #e94560; color: white; cursor: pointer; font-weight: bold; }
        button:active { transform: scale(0.96); }
        .btn-blue { background: #4a6fa5 !important; }
        .btn-green { background: #2e7d32 !important; }
        .btn-gray { background: #555 !important; }
        .hidden { display: none !important; }
        .info { background: #0f3460; padding: 12px; border-radius: 10px; margin: 8px 0; font-size: 16px; }
        .info span { color: #f5c542; font-weight: bold; }
        .msg { padding: 10px; border-radius: 8px; margin: 8px 0; text-align: center; }
        .msg-ok { background: #2e7d32; }
        .msg-err { background: #c62828; }
        .wheel-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        #wheelCanvas { border-radius: 50%; box-shadow: 0 0 30px gold; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 24px; cursor: pointer; }
        .winner-text { color: gold; font-size: 26px; margin-top: 20px; font-weight: bold; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: gold; color: black; padding: 15px 25px; border-radius: 30px; font-weight: bold; z-index: 300; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="authSection">
        <h1>🎰 يانصيب شام كاش</h1>
        <div class="card">
            <h2>تسجيل الدخول</h2>
            <div id="authMsg"></div>
            <input type="text" id="phoneInput" placeholder="📱 رقم الهاتف">
            <input type="password" id="passwordInput" placeholder="🔒 كلمة المرور">
            <button onclick="login()">🔑 دخول</button>
            <button onclick="register()" class="btn-blue">📝 تسجيل جديد</button>
        </div>
    </div>

    <div id="mainSection" class="hidden">
        <h1>🎰 يانصيب شام كاش</h1>
        
        <div class="card">
            <div class="info">💰 الرصيد: <span id="balance">0</span> ل.س</div>
            <div class="info">🎁 رصيد مجاني: <span id="freeBalance">0</span> ل.س</div>
            <div class="info">🎫 البطاقات: <span id="ticketCount">0</span> / 50</div>
            <div id="buyMsg"></div>
            <button id="buyBtn" onclick="buyTicket()">🛒 شراء بطاقة (10,000 ل.س)</button>
            <button onclick="logout()" class="btn-gray">🚪 تسجيل خروج</button>
        </div>

        <div class="card">
            <h2>📎 إيداع مع إيصال</h2>
            <input type="file" id="receiptFile" accept="image/*" onchange="previewReceipt()">
            <img id="receiptPreview" class="hidden" style="max-width:100%; max-height:150px; border-radius:8px; margin:5px 0;">
            <input type="number" id="receiptAmount" placeholder="المبلغ" value="10000">
            <button onclick="submitDeposit()" class="btn-green">📤 إرسال طلب الإيداع</button>
        </div>

        <div class="card">
            <h2>💸 سحب إلى شام كاش</h2>
            <input type="text" id="withdrawAccount" placeholder="رقم حساب شام كاش">
            <input type="number" id="withdrawAmount" placeholder="المبلغ" value="10000">
            <button onclick="requestWithdraw()">طلب سحب</button>
        </div>

        <div class="card">
            <h2>🎡 العجلة المجانية</h2>
            <p style="font-size:14px;">شاهد إعلاناً واربح رصيداً مجانياً</p>
            <button onclick="startRewardedAd()" class="btn-blue">▶ شاهد إعلان + لف العجلة</button>
            <div id="freeSpinResult" style="margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>
</div>

<div id="wheelModal" class="wheel-modal hidden" onclick="closeWheel(event)">
    <button class="close-btn" onclick="closeWheel(event)">✖</button>
    <canvas id="wheelCanvas" width="320" height="320"></canvas>
    <div id="wheelWinner" class="winner-text"></div>
</div>

<script>
    let currentUser = null;
    let appState = {};
    let spinAngle = 0, spinTarget = 0, winnerIdx = -1, animId = null, animStart = 0;

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    async function apiFetch(url, method = 'GET', body = null) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);
        return await res.json();
    }

    async function fetchState() {
        const data = await apiFetch('/api/state');
        appState = data;
        if (data.logged_in && data.user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            currentUser = data.user;
            document.getElementById('balance').textContent = Number(data.user.balance || 0).toLocaleString();
            document.getElementById('freeBalance').textContent = Number(data.user.free_balance || 0).toLocaleString();
            document.getElementById('ticketCount').textContent = data.ticket_count || 0;
            document.getElementById('buyBtn').disabled = (data.ticket_count >= 50 || data.lottery_active);
            if (data.lottery_active && data.winner_index >= 0) {
                showWheel(data.winner_index);
            } else if (!data.lottery_active) {
                document.getElementById('wheelModal').classList.add('hidden');
            }
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('wheelModal').classList.add('hidden');
        }
    }

    async function login() {
        const phone = document.getElementById('phoneInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        if (!phone || !password) return showAuthMsg('املأ الحقول', 'err');
        const data = await apiFetch('/api/login', 'POST', { phone, password });
        if (data.error) showAuthMsg(data.error, 'err');
        else { showAuthMsg('تم الدخول', 'ok'); fetchState(); }
    }

    async function register() {
        const phone = document.getElementById('phoneInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        if (!phone || !password) return showAuthMsg('املأ الحقول', 'err');
        const data = await apiFetch('/api/register', 'POST', { phone, password });
        if (data.error) showAuthMsg(data.error, 'err');
        else { showAuthMsg('تم التسجيل', 'ok'); fetchState(); }
    }

    function showAuthMsg(msg, type) {
        document.getElementById('authMsg').innerHTML = `<div class="msg msg-${type === 'ok' ? 'ok' : 'err'}">${msg}</div>`;
    }

    async function logout() {
        await apiFetch('/api/logout', 'POST');
        location.reload();
    }

    async function buyTicket() {
        const data = await apiFetch('/api/buy', 'POST');
        if (data.error) document.getElementById('buyMsg').innerHTML = `<div class="msg msg-err">${data.error}</div>`;
        else { document.getElementById('buyMsg').innerHTML = `<div class="msg msg-ok">${data.message}</div>`; fetchState(); }
    }

    async function submitDeposit() {
        const amount = parseInt(document.getElementById('receiptAmount').value);
        const file = document.getElementById('receiptFile').files[0];
        if (!amount || amount <= 0) return alert('أدخل مبلغاً');
        if (!file) return alert('اختر صورة الإيصال');
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = await apiFetch('/api/deposit_request', 'POST', { amount, image: e.target.result });
            alert(data.message || data.error);
            document.getElementById('receiptFile').value = '';
            document.getElementById('receiptPreview').classList.add('hidden');
            fetchState();
        };
        reader.readAsDataURL(file);
    }

    async function requestWithdraw() {
        const account = document.getElementById('withdrawAccount').value.trim();
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        if (!account || !amount) return alert('املأ البيانات');
        const data = await apiFetch('/api/withdraw_request', 'POST', { account, amount });
        alert(data.message || data.error);
        document.getElementById('withdrawAccount').value = '';
        fetchState();
    }

    function previewReceipt() {
        const file = document.getElementById('receiptFile').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('receiptPreview').src = e.target.result;
            document.getElementById('receiptPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    async function startRewardedAd() {
        if (!currentUser) return;
        const now = Date.now() / 1000;
        if (currentUser.last_ad_time && (now - currentUser.last_ad_time < 30)) {
            return alert(`انتظر ${Math.ceil(30 - (now - currentUser.last_ad_time))} ثانية`);
        }
        const modal = document.createElement('div');
        modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:100;";
        modal.innerHTML = `<div style="background:#1e2a4a; padding:25px; border-radius:20px; text-align:center;">
            <h3>📢 إعلان</h3><p id="adTimer">10</p><button id="adClose" disabled>انتظر...</button></div>`;
        document.body.appendChild(modal);
        let s = 10;
        const iv = setInterval(() => {
            s--; document.getElementById('adTimer').textContent = s + ' ثوانٍ';
            if (s <= 0) {
                clearInterval(iv);
                const btn = document.getElementById('adClose');
                btn.disabled = false; btn.textContent = 'اغلق واربح';
                btn.onclick = async () => {
                    modal.remove();
                    const data = await apiFetch('/api/free_spin', 'POST');
                    if (data.error) alert(data.error);
                    else {
                        document.getElementById('freeSpinResult').textContent = `🎁 ربحت ${data.prize.toLocaleString()} ل.س`;
                        fetchState();
                    }
                };
            }
        }, 1000);
    }

    function showWheel(idx) {
        winnerIdx = idx;
        const modal = document.getElementById('wheelModal');
        modal.classList.remove('hidden');
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        drawWheel(ctx, 50);
        const seg = 360 / 50;
        const target = 360 - (winnerIdx * seg + seg / 2);
        spinTarget = 360 * 8 + target;
        spinAngle = 0;
        animStart = performance.now();
        if (animId) cancelAnimationFrame(animId);
        requestAnimationFrame(animateWheel);
    }

    function drawWheel(ctx, segs) {
        const cx = 160, cy = 160, r = 150;
        ctx.clearRect(0, 0, 320, 320);
        const colors = ['#f0c27a', '#4a6fa5'];
        for (let i = 0; i < segs; i++) {
            const s = i * 2 * Math.PI / segs, e = (i + 1) * 2 * Math.PI / segs;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, s, e); ctx.closePath();
            ctx.fillStyle = colors[i % 2]; ctx.fill();
            ctx.strokeStyle = '#111'; ctx.stroke();
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(s + Math.PI / segs);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial';
            ctx.fillText(i + 1, r * 0.7, 4); ctx.restore();
        }
        ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
        ctx.fillStyle = '#e94560'; ctx.fill();
    }

    function animateWheel(ts) {
        const elapsed = ts - animStart;
        const progress = Math.min(elapsed / 5000, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        spinAngle = ease * spinTarget;
        document.getElementById('wheelCanvas').style.transform = `rotate(${spinAngle}deg)`;
        if (progress < 1) animId = requestAnimationFrame(animateWheel);
        else {
            if (appState.winner_id === currentUser?.id) {
                document.getElementById('wheelWinner').textContent = '🎊 مبروك! أنت الفائز!';
                showToast('💰 تمت إضافة الجائزة لرصيدك');
            } else {
                document.getElementById('wheelWinner').textContent = `الفائز: بطاقة ${winnerIdx + 1}`;
            }
        }
    }

    function closeWheel(e) {
        if (animId) cancelAnimationFrame(animId);
        document.getElementById('wheelModal').classList.add('hidden');
    }

    fetchState();
    setInterval(fetchState, 3000);
</script>
</body>
</html>
