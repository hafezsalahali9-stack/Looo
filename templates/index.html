<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يانصيب شام كاش</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 0; margin: 0; }
        .container { max-width: 400px; margin: auto; padding: 10px; padding-bottom: 100px; }
        .card { background: #1a2745; padding: 18px; border-radius: 15px; margin: 10px 0; }
        h1 { color: #f0c27a; text-align: center; font-size: 24px; margin: 10px 0; }
        h2 { color: #ccc; font-size: 18px; margin: 5px 0 10px; }
        input, button { display: block; width: 100%; padding: 12px; margin: 8px 0; border-radius: 25px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #0d1b33; color: white; text-align: center; border: 1px solid #3a4a6a; }
        button { background: #e94560; color: white; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
        .info { background: #0f3460; padding: 10px; border-radius: 10px; margin: 8px 0; font-size: 16px; }
        .info span { color: #f5c542; font-weight: bold; }
        .msg { padding: 10px; border-radius: 10px; margin: 8px 0; text-align: center; }
        .ok { background: #2e7d32; }
        .err { background: #c62828; }
        img.preview { max-width: 100%; max-height: 150px; border-radius: 8px; margin: 5px 0; display: none; }
        .ad-box { text-align: center; margin: 10px 0; min-height: 50px; }
        .ad-bottom { position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; z-index: 100; background: #0a0f1f; padding: 5px 0; }
    </style>
</head>
<body>

<div class="container" id="app">

<div id="authSection">
    <h1>🎰 يانصيب شام كاش</h1>
    
    <!-- إعلان علوي -->
    <div class="ad-box">
        <script>
          atOptions = {
            'key' : '4c94b3494e679d2ca0fb7acdf61e6aba',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"></script>
    </div>
    
    <div class="card">
        <h2>تسجيل الدخول</h2>
        <div id="authMsg"></div>
        <input type="text" id="phoneInput" placeholder="📱 رقم الهاتف">
        <input type="password" id="passwordInput" placeholder="🔒 كلمة المرور">
        <button onclick="login()">🔑 دخول</button>
        <button onclick="register()" style="background:#4a6fa5;">📝 تسجيل جديد</button>
    </div>
</div>

<div id="mainSection" class="hidden">
    <h1>🎰 يانصيب شام كاش</h1>
    
    <!-- إعلان علوي -->
    <div class="ad-box">
        <script>
          atOptions = {
            'key' : '4c94b3494e679d2ca0fb7acdf61e6aba',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"></script>
    </div>
    
    <div class="card">
        <div class="info">💰 الرصيد: <span id="balance">0</span> ل.س</div>
        <div class="info">🎫 البطاقات: <span id="ticketCount">0</span> / 50</div>
        <button id="buyBtn" onclick="buyTicket()">🛒 شراء بطاقة (10,000 ل.س)</button>
        <button onclick="logout()" style="background:#555;">🚪 تسجيل خروج</button>
    </div>

    <!-- إعلان وسطي -->
    <div class="ad-box">
        <script>
          atOptions = {
            'key' : '4c94b3494e679d2ca0fb7acdf61e6aba',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"></script>
    </div>

    <div class="card">
        <h2>📎 إيداع مع إيصال</h2>
        <input type="file" id="receiptFile" accept="image/*" onchange="preview()">
        <img id="previewImg" class="preview">
        <input type="number" id="depositAmount" placeholder="💰 المبلغ" value="50000">
        <button onclick="submitDeposit()" style="background:#2e7d32;">📤 إرسال طلب الإيداع</button>
    </div>

    <div class="card">
        <h2>💸 سحب إلى شام كاش</h2>
        <input type="text" id="withdrawAccount" placeholder="🔢 رقم حساب شام كاش">
        <input type="number" id="withdrawAmount" placeholder="💰 المبلغ" value="10000">
        <button onclick="submitWithdraw()">📤 طلب سحب</button>
    </div>
</div>

</div>

<!-- إعلان سفلي ثابت -->
<div class="ad-bottom">
    <script>
      atOptions = {
        'key' : '4c94b3494e679d2ca0fb7acdf61e6aba',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"></script>
</div>

<script>
    async function api(url, method = 'GET', body = null) {
        let opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        let res = await fetch(url, opts);
        return await res.json();
    }

    async function refresh() {
        let d = await api('/api/state');
        if (d.logged_in) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('balance').textContent = Number(d.user.balance).toLocaleString();
            document.getElementById('ticketCount').textContent = d.ticket_count;
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
    }

    function showAuthMsg(m, t) {
        document.getElementById('authMsg').innerHTML = `<div class="msg ${t}">${m}</div>`;
    }

    async function login() {
        let phone = document.getElementById('phoneInput').value.trim();
        let pwd = document.getElementById('passwordInput').value.trim();
        if (!phone || !pwd) return showAuthMsg('املأ جميع الحقول', 'err');
        let d = await api('/api/login', 'POST', { phone, password: pwd });
        if (d.error) showAuthMsg(d.error, 'err');
        else { showAuthMsg('✅ تم الدخول', 'ok'); refresh(); }
    }

    async function register() {
        let phone = document.getElementById('phoneInput').value.trim();
        let pwd = document.getElementById('passwordInput').value.trim();
        if (!phone || !pwd) return showAuthMsg('املأ جميع الحقول', 'err');
        let d = await api('/api/register', 'POST', { phone, password: pwd });
        if (d.error) showAuthMsg(d.error, 'err');
        else { showAuthMsg('✅ تم التسجيل', 'ok'); refresh(); }
    }

    async function logout() { await api('/api/logout', 'POST'); location.reload(); }

    async function buyTicket() {
        let ad = confirm('📢 إعلان سريع:\n\nهل تريد متابعة شراء البطاقة؟');
        if (!ad) return;
        let d = await api('/api/buy', 'POST');
        alert(d.message || d.error);
        refresh();
    }

    async function submitDeposit() {
        let amt = parseInt(document.getElementById('depositAmount').value);
        let file = document.getElementById('receiptFile').files[0];
        if (!amt || amt <= 0) return alert('أدخل مبلغاً صحيحاً');
        if (!file) return alert('اختر صورة الإيصال');
        let reader = new FileReader();
        reader.onload = async function(e) {
            let d = await api('/api/deposit', 'POST', { amount: amt, image: e.target.result });
            alert(d.message || d.error);
            document.getElementById('receiptFile').value = '';
            document.getElementById('previewImg').style.display = 'none';
            refresh();
        };
        reader.readAsDataURL(file);
    }

    async function submitWithdraw() {
        let acc = document.getElementById('withdrawAccount').value.trim();
        let amt = parseInt(document.getElementById('withdrawAmount').value);
        if (!acc || !amt) return alert('املأ البيانات');
        let d = await api('/api/withdraw', 'POST', { account: acc, amount: amt });
        alert(d.message || d.error);
        refresh();
    }

    function preview() {
        let file = document.getElementById('receiptFile').files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('previewImg').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    refresh();
    setInterval(refresh, 3000);
</script>
</body>
</html>
