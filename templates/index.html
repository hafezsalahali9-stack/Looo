<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 يانصيب iChansy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma; background: #0a0f1f; color: #eee; padding: 10px; }
        .container { max-width: 420px; margin: auto; padding-bottom: 80px; }
        .card { background: #1a2745; padding: 18px; border-radius: 16px; margin: 10px 0; border: 1px solid #2a3a55; }
        h1 { color: #f0c27a; text-align: center; font-size: 28px; }
        h2 { font-size: 18px; margin: 5px 0; color: #ddd; }
        input, button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 25px; border: none; font-size: 16px; }
        input { background: #0d1b33; color: white; text-align: center; border: 1px solid #3a4a6a; }
        button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
        button:active { transform: scale(0.95); }
        .btn-gold { background: linear-gradient(45deg, #f0c27a, #d4a84b) !important; color: #000 !important; }
        .hidden { display: none !important; }
        .info { background: #0f3460; padding: 10px; border-radius: 10px; margin: 6px 0; font-size: 15px; }
        .info span { color: #f5c542; font-weight: bold; }
        .jackpot-box { background: linear-gradient(135deg, #f0c27a, #e94560); padding: 15px; border-radius: 15px; text-align: center; margin: 10px 0; font-size: 20px; font-weight: bold; color: #000; }
        .countdown { font-size: 20px; color: #ff9800; margin: 10px 0; text-align: center; }
        .msg { padding: 10px; border-radius: 10px; margin: 6px 0; text-align: center; }
        .ok { background: #2e7d32; } .err { background: #c62828; }
        .ticket-item { display: inline-block; background: #0f3460; padding: 6px 12px; border-radius: 20px; margin: 3px; font-size: 14px; }
        .ad-box { margin: 10px 0; min-height: 60px; background: #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .ad-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #0a0f1f; padding: 5px; min-height: 60px; z-index: 100; display: flex; align-items: center; justify-content: center; }
        
        /* عجلة السحب */
        .wheel-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .wheel-container { position: relative; width: 300px; height: 300px; }
        #wheelCanvas { border-radius: 50%; box-shadow: 0 0 40px rgba(240,194,122,0.8); }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #e94560; z-index: 10; }
        .wheel-winner { color: #f0c27a; font-size: 28px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="authSection">
        <h1>🎰 يانصيب iChansy</h1>
        <div class="card">
            <h2>تسجيل الدخول</h2>
            <div id="authMsg"></div>
            <input type="text" id="phoneInput" placeholder="📱 رقم الهاتف">
            <input type="password" id="passwordInput" placeholder="🔒 كلمة المرور">
            <button onclick="login()">🔑 دخول</button>
            <button onclick="register()" style="background:#4a6fa5;">📝 تسجيل جديد</button>
        </div>
    </div>

    <div id="mainSection" class="hidden">
        <h1>🎰 يانصيب iChansy</h1>
        
        <div class="ad-box" id="adTop"></div>
        
        <div class="card">
            <div class="info">💰 رصيدي: <span id="balance">0</span> ل.س</div>
            <div class="info">🎫 بطاقاتي: <span id="myTickets"></span></div>
        </div>
        
        <div class="jackpot-box">
            🏆 الجائزة الكبرى: <span id="expectedJackpot">0</span> ل.س
        </div>
        <div class="countdown" id="drawTimer">⏳ السحب القادم: --:--</div>
        <div class="info" style="text-align:center;">🎫 البطاقات المباعة: <span id="ticketCount">0</span> | السحب كل ساعة</div>
        
        <button onclick="buyTicket()" class="btn-gold">🛒 شراء بطاقة (10,000 ل.س)</button>
        <button onclick="logout()" style="background:#555;">🚪 تسجيل خروج</button>
        
        <div class="ad-box" id="adMid"></div>
        
        <a href="/games" style="display:block; background:linear-gradient(45deg,#ff9800,#e65100); color:#fff; padding:14px; border-radius:25px; text-align:center; margin:10px 0; font-weight:bold; text-decoration:none; font-size:18px;">🎰 ألعاب الكازينو</a>
        
        <div class="card">
            <h2>📎 إيداع</h2>
            <input type="file" id="receiptFile" accept="image/*">
            <input type="number" id="depositAmount" placeholder="💰 المبلغ" value="50000">
            <button onclick="submitDeposit()" style="background:#2e7d32;">📤 إرسال</button>
        </div>
        
        <div class="card">
            <h2>💸 سحب</h2>
            <input type="text" id="withdrawAccount" placeholder="🔢 حساب شام كاش">
            <input type="number" id="withdrawAmount" placeholder="💰 المبلغ" value="10000">
            <button onclick="submitWithdraw()">📤 طلب سحب</button>
        </div>
        
        <div class="card">
            <h2>📋 طلباتي</h2>
            <div id="myRequests"><span style="color:#aaa;">لا طلبات</span></div>
        </div>
    </div>
</div>

<div class="ad-bottom" id="adBottom"></div>

<div id="wheelOverlay" class="wheel-overlay hidden">
    <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <div class="wheel-winner" id="wheelWinner"></div>
</div>

<script>
    // ========== تحميل الإعلانات ==========
    function loadAds() {
        const adCode1 = `<script>atOptions = {'key' : '4c94b3494e679d2ca0fb7acdf61e6aba','format' : 'iframe','height' : 50,'width' : 320,'params' : {}};<\/script><script src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"><\/script>`;
        const adCode2 = `<script src="https://pl29623870.effectivecpmnetwork.com/a2/48/f5/a248f547e17b13e2f93e91b63e882358.js"><\/script>`;
        
        ['adTop', 'adMid', 'adBottom'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = adCode1 + adCode2;
        });
    }
    loadAds();

    let token = localStorage.getItem('token') || '';

    async function api(url, method='POST', body={}) {
        const opts = {method, headers:{'Content-Type':'application/json'}};
        if(body) { body.token = token; opts.body = JSON.stringify(body); }
        else opts.body = JSON.stringify({token});
        const res = await fetch(url, opts);
        return await res.json();
    }

    // ========== عجلة السحب ==========
    let wheelAngle = 0, wheelAnimId = null;
    
    function drawWheel(segments, winnerNum) {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 150, cy = 150, r = 140;
        ctx.clearRect(0, 0, 300, 300);
        const colors = ['#f0c27a','#e94560','#4a6fa5','#2e7d32','#ff9800','#9c27b0'];
        
        for (let i = 0; i < segments; i++) {
            const startAngle = (i * 2 * Math.PI) / segments;
            const endAngle = ((i + 1) * 2 * Math.PI) / segments;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(startAngle + Math.PI / segments);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText(i + 1, r * 0.65, 6);
            ctx.restore();
        }
        
        const segAngle = 360 / segments;
        const targetAngle = 360 - (winnerNum * segAngle + segAngle / 2);
        return 360 * 5 + targetAngle;
    }
    
    function animateWheel(targetAngle) {
        const canvas = document.getElementById('wheelCanvas');
        const startAngle = wheelAngle;
        const startTime = performance.now();
        const duration = 5000;
        
        function step(ts) {
            const elapsed = ts - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            wheelAngle = startAngle + (targetAngle - startAngle) * ease;
            canvas.style.transform = `rotate(${wheelAngle}deg)`;
            if (progress < 1) {
                wheelAnimId = requestAnimationFrame(step);
            }
        }
        wheelAnimId = requestAnimationFrame(step);
    }
    
    function showSpinWheel(winnerNumber) {
        const overlay = document.getElementById('wheelOverlay');
        overlay.classList.remove('hidden');
        document.getElementById('wheelWinner').textContent = '';
        const targetAngle = drawWheel(50, winnerNumber);
        animateWheel(targetAngle);
        
        setTimeout(() => {
            document.getElementById('wheelWinner').textContent = `🎉 الفائز: البطاقة #${winnerNumber}`;
            setTimeout(() => overlay.classList.add('hidden'), 4000);
        }, 5000);
    }

    // ========== التطبيق ==========
    async function refresh() {
        const d = await api('/api/state','POST');
        if(d.logged_in) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            
            document.getElementById('balance').textContent = Number(d.user.balance).toLocaleString();
            document.getElementById('ticketCount').textContent = d.ticket_count;
            document.getElementById('expectedJackpot').textContent = Number(d.expected_jackpot).toLocaleString();
            
            const rem = d.seconds_remaining;
            document.getElementById('drawTimer').textContent = `⏳ ${Math.floor(rem/60)}:${(rem%60).toString().padStart(2,'0')}`;
            
            if (d.draw_active && d.draw_winner) {
                showSpinWheel(parseInt(d.draw_winner));
            }
            
            loadMyRequests();
            loadMyTickets();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
    }

    async function loadMyTickets() {
        const d = await api('/api/my_tickets','POST',{});
        document.getElementById('myTickets').innerHTML = d.tickets?.length ? d.tickets.map(n=>`<span class="ticket-item">#${n}</span>`).join(' ') : '<span style="color:#aaa;">لا بطاقات</span>';
    }

    async function loadMyRequests() {
        const d = await api('/api/my_requests','POST',{});
        let h = '';
        if(d.deposits?.length) { h += '<p><strong>📥 الإيداعات:</strong></p>'; d.deposits.forEach(r => h += `<div style="font-size:12px;background:#0f3460;padding:4px;border-radius:4px;margin:2px 0;">${r.amount} ل.س - <span style="color:${r.status==='مؤكد'?'#2e7d32':'#f57f17'}">${r.status}</span></div>`); }
        if(d.withdrawals?.length) { h += '<p><strong>📤 السحوبات:</strong></p>'; d.withdrawals.forEach(r => h += `<div style="font-size:12px;background:#0f3460;padding:4px;border-radius:4px;margin:2px 0;">${r.amount} ل.س - <span style="color:${r.status==='مؤكد'?'#2e7d32':'#f57f17'}">${r.status}</span></div>`); }
        document.getElementById('myRequests').innerHTML = h || '<span style="color:#aaa;">لا طلبات</span>';
    }

    async function login() {
        const ph = document.getElementById('phoneInput').value.trim();
        const pw = document.getElementById('passwordInput').value.trim();
        if(!ph||!pw) return;
        const d = await api('/api/login','POST',{phone:ph,password:pw});
        if(d.error) document.getElementById('authMsg').innerHTML = `<div class="msg err">${d.error}</div>`;
        else { token = d.token; localStorage.setItem('token', token); refresh(); }
    }

    async function register() {
        const ph = document.getElementById('phoneInput').value.trim();
        const pw = document.getElementById('passwordInput').value.trim();
        if(!ph||!pw) return;
        const d = await api('/api/register','POST',{phone:ph,password:pw});
        if(d.error) document.getElementById('authMsg').innerHTML = `<div class="msg err">${d.error}</div>`;
        else { token = d.token; localStorage.setItem('token', token); refresh(); }
    }

    function logout() { localStorage.removeItem('token'); location.reload(); }

    function buyTicket() {
        if (confirm('📢 شاهد الإعلان ثم اضغط موافق للمتابعة')) {
            api('/api/buy','POST',{}).then(d => {
                alert(d.message || d.error);
                refresh();
            });
        }
    }

    function submitDeposit() {
        const amt = parseInt(document.getElementById('depositAmount').value);
        const file = document.getElementById('receiptFile').files[0];
        if(!amt||!file) return alert('تأكد من البيانات');
        const reader = new FileReader();
        reader.onload = async e => {
            const d = await api('/api/deposit','POST',{amount:amt,image:e.target.result});
            alert(d.message||d.error);
            refresh();
        };
        reader.readAsDataURL(file);
    }

    function submitWithdraw() {
        const acc = document.getElementById('withdrawAccount').value.trim();
        const amt = parseInt(document.getElementById('withdrawAmount').value);
        if(!acc||!amt) return alert('املأ البيانات');
        api('/api/withdraw','POST',{account:acc,amount:amt}).then(d => {
            alert(d.message||d.error);
            refresh();
        });
    }

    refresh();
    setInterval(refresh, 3000);
</script>
</body>
</html>
