<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 15px; }
        h1 { color: #f0c27a; text-align: center; }
        h2 { color: #ccc; border-bottom: 2px solid #e94560; padding-bottom: 5px; margin-top: 25px; }
        .card { background: #0f3460; padding: 15px; border-radius: 12px; margin: 10px 0; }
        .card img { max-width: 100%; max-height: 250px; border-radius: 8px; display: block; margin: 10px 0; }
        button { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 25px; font-size: 16px; width: 100%; margin: 5px 0; cursor: pointer; }
        .refresh { background: #1565c0; }
        .info { margin: 5px 0; }
        .info span { color: #f5c542; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .badge-pending { background: #f57f17; color: #000; }
        .badge-done { background: #2e7d32; color: #fff; }
    </style>
</head>
<body>
    <h1>🔑 لوحة الإدارة</h1>
    <button class="refresh" onclick="load()">🔄 تحديث</button>

    <h2>📥 طلبات الإيداع</h2>
    <div id="deposits"></div>
    <button onclick="approveDeposits()">✅ تأكيد جميع الإيداعات</button>

    <h2>📤 طلبات السحب</h2>
    <div id="withdrawals"></div>
    <button onclick="approveWithdrawals()">✅ تأكيد جميع السحوبات</button>

    <p style="text-align:center; margin-top:30px;"><a href="/" style="color:#4a6fa5;">العودة للتطبيق</a></p>

    <script>
        async function api(url, method = 'GET') {
            let res = await fetch(url, { method });
            return await res.json();
        }

        async function load() {
            let deps = await api('/api/admin/deposits');
            let html = '';
            if (deps.length === 0) html = '<p style="color:#888;">لا توجد طلبات</p>';
            else deps.forEach(d => {
                html += `<div class="card">
                    <div class="info">💰 المبلغ: <span>${Number(d.amount).toLocaleString()} ل.س</span></div>
                    <div class="info">🕐 ${d.timestamp} | <span class="badge ${d.status === 'معلق' ? 'badge-pending' : 'badge-done'}">${d.status}</span></div>
                    ${d.image ? `<img src="${d.image}" alt="إيصال">` : ''}
                </div>`;
            });
            document.getElementById('deposits').innerHTML = html;

            let wits = await api('/api/admin/withdrawals');
            html = '';
            if (wits.length === 0) html = '<p style="color:#888;">لا توجد طلبات</p>';
            else wits.forEach(w => {
                html += `<div class="card">
                    <div class="info">💸 المبلغ: <span>${Number(w.amount).toLocaleString()} ل.س</span></div>
                    <div class="info">🔢 الحساب: <span>${w.account}</span></div>
                    <div class="info">🕐 ${w.timestamp} | <span class="badge ${w.status === 'معلق' ? 'badge-pending' : 'badge-done'}">${w.status}</span></div>
                </div>`;
            });
            document.getElementById('withdrawals').innerHTML = html;
        }

        async function approveDeposits() {
            if (!confirm('تأكيد جميع الإيداعات؟')) return;
            let d = await api('/admin/approve-deposits', 'POST');
            alert(d.message);
            load();
        }

        async function approveWithdrawals() {
            if (!confirm('تأكيد جميع السحوبات؟')) return;
            let d = await api('/admin/approve-withdrawals', 'POST');
            alert(d.message);
            load();
        }

        load();
    </script>
</body>
</html>
