<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>لوحة الإدارة</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 15px; }
        h1 { color: #f0c27a; }
        .card { background: #0f3460; padding: 15px; border-radius: 12px; margin: 10px 0; }
        .card img { max-width: 100%; max-height: 200px; border-radius: 8px; }
        button { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 25px; width: 100%; margin: 5px 0; cursor: pointer; }
        .btn-red { background: #c62828; }
        a { color: #aaa; }
    </style>
</head>
<body>
    <h1>🔑 لوحة الإدارة</h1>
    <p><a href="/admin/logout">تسجيل خروج</a></p>
    <div id="stats" style="background:#e94560;padding:10px;border-radius:10px;"></div>
    <button onclick="loadAll()">🔄 تحديث</button>

    <h2>📥 الإيداعات</h2>
    <div id="deposits"></div>
    <button onclick="approve('/admin/approve-deposits')">✅ تأكيد الإيداعات</button>

    <h2>📤 السحوبات</h2>
    <div id="withdrawals"></div>
    <button onclick="approve('/admin/approve-withdrawals')">✅ تأكيد السحوبات</button>

    <script>
        async function loadAll() {
            const deps = await fetch('/api/admin/deposits').then(r=>r.json());
            document.getElementById('stats').innerHTML = `📥 إيداعات معلقة: ${deps.filter(d=>d.status==='معلق').length}`;
            document.getElementById('deposits').innerHTML = deps.map(d=>`<div class="card">💰 ${d.amount} ل.س - ${d.status} ${d.image?`<img src="${d.image}">`:''}</div>`).join('');
            const wits = await fetch('/api/admin/withdrawals').then(r=>r.json());
            document.getElementById('withdrawals').innerHTML = wits.map(w=>`<div class="card">💸 ${w.amount} ل.س إلى ${w.account} - ${w.status}</div>`).join('');
        }
        async function approve(url) {
            await fetch(url);
            loadAll();
        }
        loadAll();
    </script>
</body>
</html>
