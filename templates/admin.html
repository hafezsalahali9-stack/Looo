<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة يانصيب iChansy</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 15px; }
        .card { background: #0f3460; padding: 15px; border-radius: 12px; margin: 10px 0; }
        .card img { max-width: 100%; max-height: 250px; border-radius: 8px; }
        button { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 25px; width: 100%; margin: 5px 0; cursor: pointer; }
        .btn-red { background: #c62828; }
    </style>
</head>
<body>
    <h1>🔑 لوحة الإدارة</h1>
    <button onclick="loadAll()">🔄 تحديث</button>
    <h2>📥 الإيداعات</h2>
    <div id="deps"></div>
    <button onclick="approve('/admin/approve-deposits')">✅ تأكيد الإيداعات</button>
    <h2>📤 السحوبات</h2>
    <div id="wits"></div>
    <button onclick="approve('/admin/approve-withdrawals')">✅ تأكيد السحوبات</button>
    <button class="btn-red" onclick="resetUsers()">⚠️ تصفير الحسابات</button>

    <script>
        async function api(url, m='GET', b=null) {
            const o = {method:m, headers:{'Content-Type':'application/json'}};
            if(b) o.body = JSON.stringify(b);
            const r = await fetch(url, o);
            return await r.json();
        }
        async function loadAll() {
            const deps = await api('/api/admin/deposits');
            document.getElementById('deps').innerHTML = deps.length===0 ? '<p>لا توجد</p>' : deps.map(d=>`<div class="card">${d.amount} ل.س - ${d.status} ${d.image?`<img src="${d.image}">`:''}</div>`).join('');
            const wits = await api('/api/admin/withdrawals');
            document.getElementById('wits').innerHTML = wits.length===0 ? '<p>لا توجد</p>' : wits.map(w=>`<div class="card">${w.amount} ل.س إلى ${w.account} - ${w.status}</div>`).join('');
        }
        async function approve(url) { if(confirm('تأكيد؟')) { const d=await api(url,'POST'); alert(d.message); loadAll(); } }
        async function resetUsers() {
            const pw = prompt('كلمة المرور:');
            if(!pw) return;
            const d = await api('/api/admin/reset_users','POST',{password:pw});
            alert(d.message||d.error);
            loadAll();
        }
        loadAll();
    </script>
</body>
</html>
