<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>دخول الإدارة</title>
<style>
    body { background: #0a0f1f; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
    input, button { padding: 12px; margin: 10px; border-radius: 20px; border: none; width: 250px; }
    button { background: #e94560; color: white; cursor: pointer; }
</style>
</head>
<body>
<div style="text-align:center;">
    <h2>🔑 دخول لوحة الإدارة</h2>
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p id="msg"></p>
</div>
<script>
async function login() {
    const res = await fetch('/admin/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password: document.getElementById('pass').value})
    });
    const data = await res.json();
    if(data.success) location.reload();
    else document.getElementById('msg').innerHTML = '❌ ' + (data.error||'خطأ');
}
</script>
</body>
</html>
