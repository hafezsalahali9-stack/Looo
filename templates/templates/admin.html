<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 15px; margin: 0; }
        h1 { color: #f0c27a; text-align: center; font-size: 24px; }
        h2 { color: #ccc; border-bottom: 2px solid #e94560; padding-bottom: 5px; margin-top: 25px; font-size: 18px; }
        .card { background: #0f3460; padding: 15px; border-radius: 12px; margin: 10px 0; }
        .card img { max-width: 100%; max-height: 250px; border-radius: 8px; display: block; margin: 10px 0; }
        button { background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; width: 100%; margin: 8px 0; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #1565c0; }
        .info { margin: 5px 0; font-size: 15px; }
        .info span { color: #f5c542; font-weight: bold; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; }
        .badge-yellow { background: #f57f17; color: #000; }
        .badge-green { background: #2e7d32; color: #fff; }
        .empty { text-align: center; color: #888; padding: 20px; }
        a { color: #4a6fa5; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🔑 لوحة الإدارة</h1>
    <button class="btn-blue" onclick="load()">🔄 تحديث البيانات</button>

    <h2>📥 طلبات الإيداع</h2>
    <div id="depositsBox"></div>
    <button onclick="approveDeposits()">✅ تأكيد جميع الإيداعات</button>

    <h2>📤 طلبات السحب</h2>
    <div id="withdrawalsBox"></div>
    <button onclick="approveWithdrawals()">✅ تأكيد جميع السحوبات</button>

    <p style="text-align:center; margin-top:30px;"><a href="/">⬅ العودة للتطبيق</a></p>

    <script>
        async function api(url, method = 'GET') {
            let res = await fetch(url, { method });
            return await res.json();
        }
        async function load() {
            let deps = await api('/api/admin/deposits');
            let h = '';
            if (deps.length === 0) h = '<div class="empty">📭 لا توجد طلبات إيداع</div>';
            else deps.forEach(d => {
                h += `<div class="card">
                    <div class="info">💰 المبلغ: <span>${Number(d.amount).toLocaleString()} ل.س</span></div>
                    <div class="info">🕐 ${d.timestamp} | <span class="badge ${d.status==='معلق'?'badge-yellow':'badge-green'}">${d.status}</span></div>
                    ${d.image ? `<img src="${d.image}" alt="صورة الإيصال">` : ''}
                </div>`;
            });
            document.getElementById('depositsBox').innerHTML = h;

            let wits = await api('/api/admin/withdrawals');
            h = '';
            if (wits.length === 0) h = '<div class="empty">📭 لا توجد طلبات سحب</div>';
            else wits.forEach(w => {
                h += `<div class="card">
                    <div class="info">💸 المبلغ: <span>${Number(w.amount).toLocaleString()} ل.س</span></div>
                    <div class="info">🔢 الحساب: <span>${w.account}</span></div>
                    <div class="info">🕐 ${w.timestamp} | <span class="badge ${w.status==='معلق'?'badge-yellow':'badge-green'}">${w.status}</span></div>
                </div>`;
            });
            document.getElementById('withdrawalsBox').innerHTML = h;
        }
        async function approveDeposits() {
            if (!confirm('تأكيد جميع الإيداعات المعلقة؟')) return;
            let d = await api('/admin/approve-deposits', 'POST');
            alert(d.message);
            load();
        }
        async function approveWithdrawals() {
            if (!confirm('تأكيد جميع السحوبات المعلقة؟')) return;
            let d = await api('/admin/approve-withdrawals', 'POST');
            alert(d.message);
            load();
        }
        load();
    </script>
</body>
</html>
