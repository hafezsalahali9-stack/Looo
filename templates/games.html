<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب iChansy</title>
    <style>
        body { font-family: Arial; background: #0a0f1f; color: #eee; padding: 10px; text-align: center; }
        h1 { color: #f0c27a; }
        .game-card { background: #1a2745; border-radius: 15px; padding: 15px; margin: 10px; width: 120px; display: inline-block; cursor: pointer; }
        .game-area { background: #1a1a2e; border-radius: 20px; padding: 20px; margin: 15px auto; max-width: 400px; display: none; }
        .reel { display: inline-block; width: 70px; height: 70px; background: black; border-radius: 10px; font-size: 40px; line-height: 70px; margin: 5px; border: 2px solid gold; }
        button { background: #e94560; color: white; padding: 12px; border-radius: 25px; border: none; font-size: 16px; width: 100%; margin: 8px 0; cursor: pointer; }
        .ad-box { margin: 10px 0; min-height: 60px; background: #111; border-radius: 10px; padding: 5px; }
        .ad-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #0a0f1f; padding: 5px 0; min-height: 60px; }
    </style>
</head>
<body>
<h1>🎰 ألعاب iChansy</h1>
<div class="ad-box" id="adTop"></div>

<div>
    <div class="game-card" onclick="showGame('slots')"><span style="font-size:32px;">🎰</span><br>سلوتس</div>
    <div class="game-card" onclick="showGame('roulette')"><span style="font-size:32px;">🎡</span><br>روليت</div>
    <div class="game-card" onclick="showGame('blackjack')"><span style="font-size:32px;">🃏</span><br>بلاك جاك</div>
    <div class="game-card" onclick="showGame('dice')"><span style="font-size:32px;">🎲</span><br>نرد</div>
    <div class="game-card" onclick="showGame('poker')"><span style="font-size:32px;">♠️</span><br>بوكر</div>
</div>

<div id="slotsArea" class="game-area">
    <h2>🎰 سلوتس</h2>
    <div><span class="reel" id="r1">🍒</span><span class="reel" id="r2">🍒</span><span class="reel" id="r3">🍒</span></div>
    <p id="slotsMsg"></p>
    <button onclick="playSlots()">لف (500 ل.س)</button>
</div>

<div id="rouletteArea" class="game-area">
    <h2>🎡 روليت</h2>
    <button onclick="playRoulette('red')" style="background:red;">أحمر</button>
    <button onclick="playRoulette('black')" style="background:black;">أسود</button>
    <button onclick="playRoulette('green')" style="background:green;">أخضر</button>
    <p id="rouletteMsg"></p>
</div>

<div id="blackjackArea" class="game-area">
    <h2>🃏 بلاك جاك</h2>
    <button onclick="playBlackjack()">لعب (2,000 ل.س)</button>
    <p id="blackjackMsg"></p>
</div>

<div id="diceArea" class="game-area">
    <h2>🎲 نرد</h2>
    <div id="diceBtns"></div>
    <p id="diceMsg"></p>
</div>

<div id="pokerArea" class="game-area">
    <h2>♠️ بوكر</h2>
    <button onclick="playPoker()">لعب (5,000 ل.س)</button>
    <p id="pokerMsg"></p>
</div>

<div class="ad-box" id="adMid"></div>
<a href="/" style="color:gold;">العودة لليانصيب</a>
<div class="ad-bottom" id="adFixed"></div>

<script>
    const token = localStorage.getItem('token')||'';
    function injectScript(code, parent) {
        const d = document.createElement('div'); d.innerHTML = code;
        d.querySelectorAll('script').forEach(s=>{
            const ns = document.createElement('script');
            if(s.src) ns.src=s.src; else ns.textContent=s.textContent;
            parent.appendChild(ns);
        });
    }
    const BANNER = '<scr'+'ipt>atOptions = {"key" : "4c94b3494e679d2ca0fb7acdf61e6aba","format" : "iframe","height" : 50,"width" : 320,"params" : {}};</scr'+'ipt><scr'+'ipt src="https://www.highperformanceformat.com/4c94b3494e679d2ca0fb7acdf61e6aba/invoke.js"></scr'+'ipt>';
    function loadAd(id) { injectScript(BANNER, document.getElementById(id)); }
    loadAd('adTop'); loadAd('adMid'); loadAd('adFixed');

    async function api(url, body={}) {
        body.token = token;
        const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        return await r.json();
    }

    function showGame(g) {
        ['slots','roulette','blackjack','dice','poker'].forEach(x=>document.getElementById(x+'Area').style.display='none');
        document.getElementById(g+'Area').style.display='block';
        if(g==='dice' && document.getElementById('diceBtns').innerHTML==='') {
            let h = '';
            for(let i=1;i<=6;i++) h += `<button onclick="playDice(${i})" style="width:45px;margin:3px;">${i}</button>`;
            document.getElementById('diceBtns').innerHTML = h;
        }
    }

    async function playSlots() {
        const d = await api('/api/slots');
        if(d.error) return alert(d.error);
        document.getElementById('r1').textContent=d.result[0];
        document.getElementById('r2').textContent=d.result[1];
        document.getElementById('r3').textContent=d.result[2];
        document.getElementById('slotsMsg').textContent = d.win>0?`ربحت ${d.win} ل.س!`:'حاول مرة أخرى';
    }

    async function playRoulette(bet) {
        const d = await api('/api/roulette',{bet});
        if(d.error) return alert(d.error);
        document.getElementById('rouletteMsg').textContent = `النتيجة: ${d.result} - ${d.win>0?'ربحت '+d.win+' ل.س':'خسرت'}`;
    }

    async function playBlackjack() {
        const d = await api('/api/blackjack');
        if(d.error) return alert(d.error);
        document.getElementById('blackjackMsg').textContent = `يدك: ${d.player} | الموزع: ${d.dealer} - ${d.win>0?'ربحت '+d.win+' ل.س':(d.result==='push'?'تعادل':'خسرت')}`;
    }

    async function playDice(choice) {
        const d = await api('/api/dice',{choice});
        if(d.error) return alert(d.error);
        document.getElementById('diceMsg').textContent = `النرد: ${d.dice} - ${d.win>0?'ربحت '+d.win+' ل.س':'خسرت'}`;
    }

    async function playPoker() {
        const d = await api('/api/poker');
        if(d.error) return alert(d.error);
        document.getElementById('pokerMsg').textContent = `يدك: ${d.player} | الموزع: ${d.dealer} - ${d.win>0?'ربحت '+d.win+' ل.س':'خسرت'}`;
    }
</script>
</body>
</html>
